<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse — Live Roblox Game Analytics</title>
  <meta name="description" content="Track and compare live player counts, visits and ratings for any Roblox game, with 24 hours of history.">
  <meta name="theme-color" content="#07080f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="orbs" aria-hidden="true"><i></i><i></i></div>

  <header class="top">
    <div class="brand"><span class="beat"></span>Pulse</div>
    <form id="add" class="add" autocomplete="off">
      <input id="query" placeholder="Paste a Roblox game link or place ID" aria-label="Roblox game link or place ID">
      <button type="submit"><span>Track</span></button>
    </form>
    <div class="live"><span class="dot"></span><span id="status">Connecting…</span></div>
    <div class="poll" aria-hidden="true"><i></i></div>
  </header>

  <main>
    <section class="hero-stats">
      <div class="big-stat loading">
        <span class="label">Players right now · tracked games</span>
        <div>
          <span id="total" class="value">—</span>
          <span id="total-delta" class="trend"></span>
        </div>
        <div class="spark-wrap total"><canvas id="total-spark" class="spark"></canvas></div>
        <dl class="mini">
          <div><dt>Peak <span class="range-label">24h</span></dt><dd id="peak">—</dd></div>
          <div><dt>Low <span class="range-label">24h</span></dt><dd id="low">—</dd></div>
        </dl>
      </div>
      <div class="chart-wrap loading">
        <div class="chart-head">
          <span class="label">Concurrent players</span>
          <div class="ranges" role="group" aria-label="Chart range">
            <button type="button" data-range="1h">1H</button>
            <button type="button" data-range="6h">6H</button>
            <button type="button" data-range="24h">24H</button>
          </div>
        </div>
        <div class="plot">
          <canvas id="chart"></canvas>
          <div id="ends" class="ends" aria-hidden="true"></div>
          <div id="tooltip" class="tooltip" hidden></div>
        </div>
        <div id="legend" class="legend"></div>
      </div>
    </section>

    <p id="error" class="error" hidden></p>

    <section id="games" class="games" aria-live="polite"></section>

    <section class="share">
      <span class="label">Share of players</span>
      <div id="share" class="share-bar"></div>
      <div id="share-key" class="share-key"></div>
    </section>
  </main>

  <footer>
    Data from Roblox's public APIs: live counts every 30 seconds, history every 10 minutes. Not affiliated with Roblox.
    · Built by <a href="https://mistrkoala.netlify.app" target="_blank" rel="noopener">Koala</a>
  </footer>

  <template id="card-tpl">
    <article class="card">
      <button class="remove" aria-label="Stop tracking">×</button>
      <div class="card-top">
        <img class="icon" alt="" loading="lazy">
        <div>
          <a class="name" target="_blank" rel="noopener"></a>
          <div class="creator"></div>
        </div>
      </div>
      <div class="ccu"><span class="ccu-value">0</span><span class="trend"></span></div>
      <span class="ccu-label">playing now</span>
      <div class="spark-wrap"><canvas class="spark"></canvas></div>
      <div class="range-stats"><span class="peak"></span><span class="low"></span></div>
      <dl class="metrics">
        <div><dt>Visits</dt><dd class="visits"></dd></div>
        <div><dt>Favorites</dt><dd class="favorites"></dd></div>
        <div><dt>Rating</dt><dd class="rating"></dd></div>
        <div><dt>Updated</dt><dd class="updated"></dd></div>
      </dl>
      <div class="rating-bar"><i></i></div>
    </article>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
